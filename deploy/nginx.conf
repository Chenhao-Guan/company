# Nginx 配置文件 - 厦门联备网站
#
# 使用方法:
# 1. 复制此文件到 /etc/nginx/sites-available/xiamen-union-spares
# 2. 创建软链接: ln -s /etc/nginx/sites-available/xiamen-union-spares /etc/nginx/sites-enabled/
# 3. 修改 server_name 为你的域名
# 4. 测试配置: nginx -t
# 5. 重载配置: nginx -s reload

# 上游服务器配置 (PM2 运行的 Next.js 应用)
upstream xiamen_union_spares_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP 服务器配置 (重定向到 HTTPS)
server {
    listen 80;
    listen [::]:80;

    server_name your-domain.com www.your-domain.com;  # 修改为你的域名

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 服务器配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name your-domain.com www.your-domain.com;  # 修改为你的域名

    # SSL 证书配置 (使用 Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;  # 修改为你的域名
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;  # 修改为你的域名

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 客户端上传大小限制
    client_max_body_size 10M;

    # 日志配置
    access_log /var/log/nginx/xiamen-union-spares-access.log;
    error_log /var/log/nginx/xiamen-union-spares-error.log;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 静态资源缓存
    location /_next/static {
        alias /var/www/xiamen-union-spares/.next/static;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 图片缓存
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        root /var/www/xiamen-union-spares/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 字体缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 反向代理到 Next.js 应用
    location / {
        proxy_pass http://xiamen_union_spares_backend;

        # 代理头设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # 下一跳错误处理
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_intercept_errors off;
    }

    # 健康检查端点
    location /health {
        access_log off;
        proxy_pass http://xiamen_union_spares_backend;
    }
}
